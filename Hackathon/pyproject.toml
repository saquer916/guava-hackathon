[project]
name = "hackathon"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "guava-sdk==0.45.0",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.13.5,<3",
    "typing-extensions>=4.16,<5",
]

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "mypy>=1.18,<2",
    "pytest>=8.4,<9",
    "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clinical_triage"]
