# Managed by Engineering Fleet. Regenerate with: fleet init --ci
# verification-config-sha256: 9533ff14137bac2eb0e74f3463eedee8654f92f49e200bf245d65e0930f913af
name: Fleet Verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  fleet_lint:
    name: 'Fleet · Python lint'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: 'Hackathon/uv.lock'
      - name: 'Python lint'
        working-directory: 'Hackathon'
        run: |
          'uv' 'run' '--frozen' 'ruff' 'check' '.'
      - name: Record commit binding
        if: always()
        run: |
          echo "Fleet check: lint" >> "$GITHUB_STEP_SUMMARY"
          echo "Fleet verification commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Fleet verification result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  fleet_typecheck:
    name: 'Fleet · Python typecheck'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: 'Hackathon/uv.lock'
      - name: 'Python typecheck'
        working-directory: 'Hackathon'
        run: |
          'uv' 'run' '--frozen' 'mypy' 'src' 'tests'
      - name: Record commit binding
        if: always()
        run: |
          echo "Fleet check: typecheck" >> "$GITHUB_STEP_SUMMARY"
          echo "Fleet verification commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Fleet verification result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  fleet_test:
    name: 'Fleet · Deterministic tests'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: 'Hackathon/uv.lock'
      - name: 'Deterministic tests'
        working-directory: 'Hackathon'
        run: |
          'uv' 'run' '--frozen' 'pytest' '-q'
      - name: Record commit binding
        if: always()
        run: |
          echo "Fleet check: test" >> "$GITHUB_STEP_SUMMARY"
          echo "Fleet verification commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Fleet verification result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  fleet_build:
    name: 'Fleet · Python package build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: 'Hackathon/uv.lock'
      - name: 'Python package build'
        working-directory: 'Hackathon'
        run: |
          'uv' 'run' '--frozen' 'hatchling' 'build'
      - name: Record commit binding
        if: always()
        run: |
          echo "Fleet check: build" >> "$GITHUB_STEP_SUMMARY"
          echo "Fleet verification commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Fleet verification result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
